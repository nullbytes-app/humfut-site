<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HumFut</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --accent: #6d4fc2;
    --border: #e4e2ea;
    --card: #f7f6fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14121a;
      --fg: #f0eef7;
      --muted: #b7b2c6;
      --accent: #b39bff;
      --border: #2c2836;
      --card: #1d1a26;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  main {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  p.tag {
    color: var(--muted);
    margin: 0 0 28px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link-card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--fg);
    font-weight: 600;
  }
  a.link-card span {
    display: block;
    font-weight: 400;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 2px;
  }
</style>
</head>
<body>
<main>
  <h1>HumFut</h1>
  <p class="tag">Sounds for Calls</p>
  <div class="links">
    <a class="link-card" href="support.html">Support
      <span>Requirements, FAQ, and how to reach us</span>
    </a>
    <a class="link-card" href="privacy.html">Privacy Policy
      <span>What data HumFut collects (none)</span>
    </a>
  </div>
</main>
</body>
</html>
